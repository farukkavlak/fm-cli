# Round 1. Run: tools/fm-round.py dry tests/live/round1.toml, then run.

[[test]]
task = "T106"
name = "an unknown captain is refused, nothing changes"
at = "calm"
repeat = 3
steps = [
  { read = "captains", path = "Captain", keep = "before", present = true },
  { run = "captains --captain zzzq", rc = "fail" },
  { read = "captains", path = "Captain", same_as = "before" },
]

[[test]]
task = "T106"
name = "an unknown vice captain is refused, nothing changes"
at = "calm"
repeat = 3
steps = [
  { read = "captains", path = "ViceCaptain", keep = "before", present = true },
  { run = "captains --vice zzzq", rc = "fail" },
  { read = "captains", path = "ViceCaptain", same_as = "before" },
]

[[test]]
task = "T105"
name = "the tool itself: a state it reads is a state it can hold to"
at = "kickoff"
steps = [
  { read = "status", path = "State", is = "Tactics" },
  { read = "status", path = "DuringMatch", is = "False" },
]

[[test]]
task = "T106"
name = "a captain's change lands and reads back"
at = "calm"
fresh = true
repeat = 3
steps = [
  { read = "captains", path = "ViceCaptain", keep = "vice" },
  { read = "captains", path = "Captain", keep = "captain" },
  { run = "captains --captain {vice}" },
  { read = "captains", path = "Captain", same_as = "vice" },
]

[[test]]
task = "T106"
name = "a vice-captain's change lands and reads back, and back again the same day"
at = "calm"
fresh = true
repeat = 3
steps = [
  { read = "captains", path = "Captain", keep = "other" },
  { read = "captains", path = "ViceCaptain", keep = "vice" },
  { run = "captains --vice {other}" },
  { read = "captains", path = "ViceCaptain", same_as = "other" },
  { run = "captains --vice {vice}" },
  { read = "captains", path = "ViceCaptain", same_as = "vice" },
]

[[test]]
task = "T1"
name = "a new job's first day: tactic new opens the wizard with no tactic"
at = "newjob"
fresh = true
repeat = 3
steps = [
  { run = "tactic new" },
]

[[test]]
task = "T108"
name = "the date stays read after a simulated match, and moves on after"
at = "kickoff"
fresh = true
repeat = 2
steps = [
  { read = "status", path = "Date", keep = "day" },
  { run = "match --instant" },
  { read = "status", path = "Date", same_as = "day" },
  { run = "next", rc = "any" },
  { read = "status", path = "Date", present = true },
]

[[test]]
task = "T66"
name = "a team meeting opens a talk that ends"
at = "calm"
fresh = true
repeat = 2
steps = [
  { run = "meeting" },
  { read = "talk", path = "Lines", present = true, live = true, note = "the talk is open" },
]
