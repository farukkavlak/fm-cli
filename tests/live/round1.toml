# Round 1. Run: tools/fm-round.py dry tests/live/round1.toml, then run.

[[test]]
task = "T106"
name = "an unknown captain is refused, nothing changes"
at = "calm"
repeat = 3
steps = [
  { read = "captains", path = "Captain", keep = "before", present = true },
  { run = "captains --captain zzzq", rc = "fail" },
  { read = "captains", path = "Captain", same_as = "before" },
]

[[test]]
task = "T106"
name = "an unknown vice captain is refused, nothing changes"
at = "calm"
repeat = 3
steps = [
  { read = "captains", path = "ViceCaptain", keep = "before", present = true },
  { run = "captains --vice zzzq", rc = "fail" },
  { read = "captains", path = "ViceCaptain", same_as = "before" },
]

[[test]]
task = "T105"
name = "the tool itself: a state it reads is a state it can hold to"
at = "kickoff"
steps = [
  { read = "status", path = "State", is = "Tactics" },
  { read = "status", path = "DuringMatch", is = "False" },
]

[[test]]
task = "T106"
name = "a captain's change lands and reads back"
at = "calm"
fresh = true
repeat = 3
steps = [
  { read = "captains", path = "ViceCaptain", keep = "vice" },
  { read = "captains", path = "Captain", keep = "captain" },
  { run = "captains --captain {vice}" },
  { read = "captains", path = "Captain", same_as = "vice" },
]

[[test]]
task = "T106"
name = "a vice-captain's change lands and reads back; the game refuses a second one that day"
at = "calm"
fresh = true
repeat = 3
steps = [
  { read = "squad", path = "0.Name", keep = "other" },
  { read = "captains", path = "ViceCaptain", keep = "vice" },
  { run = "captains --vice {other}", rc = "any" },
  { read = "captains", path = "ViceCaptain", differs_from = "vice" },
  { run = "captains --vice {vice}", rc = "fail" },
]

[[test]]
task = "T1"
name = "a new job's first day: tactic new opens the wizard with no tactic"
at = "newjob"
fresh = true
repeat = 3
steps = [
  { run = "tactic new" },
]
