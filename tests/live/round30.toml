[[test]]
task = "T61"
name = "a player's request to be transfer-listed granted; listed once the day moves on"
at = "caught-2029-02-02"
fresh = true
repeat = 3
steps = [
  { read = "inbox", path = "?UniqueId=790122.0.NewsTitleString", keep = "msg", live = true },
  { read = "squad", path = "?Name=Mirko Sušak.0.Flags.?Id=6.#", is = "0", live = true, note = "not listed" },
  { run = "reply {msg} 2", note = "grant" },
  { read = "inbox", path = "?UniqueId=790122.0.NewsHasResponded", is = "True", live = true },
  { run = "offers 1 reject --yes", rc = "any", note = "three bids hold the day up" },
  { run = "offers 1 reject --yes", rc = "any" },
  { run = "offers 1 reject --yes", rc = "any" },
  { run = "next", rc = "any" },
  { read = "squad", path = "?Name=Mirko Sušak.0.Flags.?Id=6.#", is = "1", live = true, note = "transfer listed" },
]
