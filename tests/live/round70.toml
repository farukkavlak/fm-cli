[[test]]
task = "T87"
name = "left half way through a talk: reads pass, the talk is still there"
at = "unhappy"
fresh = true
repeat = 3
steps = [
  { read = "status", path = "Date", keep = "day" },
  { read = "status", path = "Date+Clock", keep = "moment" },
  { read = "squad", path = "#", keep = "players" },
  { read = "table", path = "#", keep = "teams" },
  { read = "tactic", path = "Slots.#", keep = "slots" },
  { read = "captains", path = "Captain", keep = "captain" },
  { read = "inbox", path = "?NewsItemIsPriority=True.?NewsHasResponded=False.0.NewsTitleString", keep = "msg", live = true },
  { run = "reply {msg} 4", note = "talk to him about it" },
  { read = "talk", path = "Answers.#", not = "0", live = true },
  { read = "status", path = "Date", same_as = "day" },
  { read = "squad", path = "#", same_as = "players" },
  { read = "inbox", path = "#", not = "0" },
  { read = "table", path = "#", same_as = "teams" },
  { read = "fixtures", path = "#", not = "0" },
  { read = "tactic", path = "Slots.#", same_as = "slots" },
  { read = "captains", path = "Captain", same_as = "captain" },
  { read = "training", path = "#", same_as = "players" },
  { read = "finances", path = "Balance", present = true },
  { read = "talk", path = "Answers.#", not = "0", live = true, note = "the reads left the talk as it was" },
]
