# Round 51: in a match, the parts not yet seen.
# - T90 / T63: a cup tie that goes to extra time (scenario `hunt-cup-extra-time`; a simulation of it went 4-3 a.e.t.,
#   a played one may not): tweaks in extra time put on, taken off, a wrong one refused; the match followed to its end
#   (penalties if it comes to that: `match`'s own log in results/round51-<lang>.log says what it showed).
# - T25: a dugout card applied at normal speed over a whole match (fast speeds took none in round 5).
# Run: tools/fm-round.py dry tests/live/round51.toml, then run.

[[test]]
task = "T90"
name = "extra time: a tweak put on and taken off, a wrong one refused, the tie played to its end"
at = "hunt-cup-extra-time"
fresh = true
fast = true
steps = [
  { start = "match --play --no-talk" },
  { until = "status", path = "Period", is = "ExtraTimeFirstHalf", seconds = 2400, every = 15, live = true, again = "dugout apply", note = "only if the tie is level at 90'; staff advice before kick-off is taken" },
  { run = "pause" },
  { read = "tweak", path = "?WillBeOn=False.0.Id", keep = "t", live = true },
  { run = "tweak {t}" },
  { read = "tweak", path = "?Id={t}.0.WillBeOn", is = "True", live = true },
  { run = "tweak {t} --off" },
  { read = "tweak", path = "?Id={t}.0.WillBeOn", is = "False", live = true },
  { run = "tweak zzq", rc = "fail" },
  { run = "resume" },
  { until = "status", path = "DuringMatch", is = "False", seconds = 2400, every = 15, live = true, again = "dugout apply", note = "through extra time (and penalties)" },
  { finish = true },
  { read = "report", path = "Fixture.HasResult", is = "True", live = true },
]

[[test]]
task = "T25"
name = "normal speed: a dugout card applied puts a tweak on; a wrong number refused"
at = "kickoff"
fresh = true
steps = [
  { start = "match --play --no-talk" },
  { until = "tweak", path = "#", not = "0", seconds = 600, every = 10, live = true, again = "dugout apply", note = "kicked off; asked slowly (T92)" },
  { read = "tweak", path = "?WillBeOn=True.#", keep = "before", live = true },
  { until = "dugout apply", path = "TweaksOn.#", not = "0", seconds = 2400, every = 10, live = true },
  { read = "tweak", path = "?WillBeOn=True.#", differs_from = "before", live = true },
  { run = "dugout 99 apply", rc = "fail", note = "not a card" },
  { until = "status", path = "DuringMatch", is = "False", seconds = 2400, every = 15, live = true, again = "dugout apply" },
  { finish = true },
  { run = "dugout apply", rc = "fail", note = "no match" },
]
