# Round 66 (day, beside the T92 reading): round 58's T29 and T25 again, after 27.0.1 and the type-lookup fix.
# - T29: a mentality change waiting when a goal goes in: the game's cancelChanges question, answered Yes.
# - T25: at slow speed a dugout card applied puts a tweak on; a wrong number refused.
# T25 sets the highlight speeds (the game's own preferences): the run around it reads them first and puts them back.
# Run: tools/fm-round.py dry tests/live/round66.toml, then run --lang en,tr.

[[test]]
task = "T29"
name = "a change waiting when a goal goes in (mentality or a team instruction): the game's cancelChanges question, answered Yes"
at = "kickoff"
fresh = true
repeat = 2  # a moment that takes luck: 2 a language
# Slow, as T25: a change waits only until the next dead ball; at full speed that is gone in a moment of real time,
# so goals mostly fell between changes (1 in 4 matches). Slow, a change is nearly always waiting.
tries = 5
steps = [
  { run = "settings 'highlight speed' 1x" },
  { run = "settings 'speed between highlights' 4x" },
  { start = "match --play --no-talk" },
  { until = "tweak", path = "#", not = "0", seconds = 600, every = 10, live = true, again = "dugout apply", note = "kicked off" },
  { read = "tactic mentality", path = "Choices.6", keep = "attacking", note = "the most attacking: goals at both ends come sooner" },
  { run = "tactic mentality {attacking}", note = "a mentality change is taken at once in FM27: it never waits, so it is set once" },
  { read = "tactic instructions", path = "0.Label", keep = "ins", note = "a team instruction: the match's tactic takes it at the next dead ball, so it waits" },
  { read = "tactic instructions", path = "0.Choices.0", keep = "x" },
  { read = "tactic instructions", path = "0.Choices.1", keep = "y" },
  { until = "dialog", path = "?Type=cancelChanges.#", not = "0", seconds = 3600, every = 5, live = true, moment = true, doing = ["tactic instructions {ins} {x}", "tactic instructions {ins} {y}"], note = "a goal with the change waiting; any other question is answered and played on" },
  { read = "dialog", path = "?Type=cancelChanges.0.Buttons.?Slot=primary.0.Label", keep = "yes", live = true },
  { run = "dialog {yes}" },
  { read = "dialog", path = "?Type=cancelChanges.#", is = "0", live = true },
  { stop = true },
]

[[test]]
task = "T25"
name = "slow speed: a dugout card applied puts its tweak or team instruction on; a wrong number refused"
at = "kickoff"
fresh = true
repeat = 2  # cards are rare: 2 a language
tries = 5
steps = [
  { run = "settings 'highlight speed' 1x" },
  { run = "settings 'speed between highlights' 4x" },
  { start = "match --play --no-talk" },
  { until = "tweak", path = "#", not = "0", seconds = 600, every = 10, live = true, again = "dugout apply", note = "kicked off; asked slowly (T92)" },
  { until = "dugout apply", path = "Applied.#", not = "0", seconds = 3600, every = 10, live = true, again = "status", moment = true, note = "a tweak card or a team instruction card, read back by the command; an injury stop is answered with a substitute" },
  { run = "dugout 99 apply", rc = "fail", note = "not a card" },
  { stop = true },
]
