# Round 44: contract talks left for a player's page are said and gone back to (T136); a press conference talked to
# its end, a journalist pressing with the same answers looked for in the log (T98).
# Run: tools/fm-round.py dry tests/live/round44.toml, then run.

[[test]]
task = "T136"
name = "talks left for the player's page: said, no talks on screen, gone back to by name"
at = "caught-2031-06-30"
fresh = true
repeat = 3
steps = [
  { read = "inbox", path = "?UniqueId=1529708.0.NewsTitleString", keep = "msg", live = true, note = "final hours of a contract" },
  { run = "reply {msg} 2", note = "enter contract negotiations" },
  { run = "contract" },
  { run = "player 'Uğurcan Yazğılı'", note = "says the talks are held, and how to go back" },
  { run = "contract", rc = "fail", note = "the screen holds no talks" },
  { run = "contract 'Uğurcan Yazğılı'", note = "back in the talks" },
  { run = "contract --next" },
  { run = "player 'Uğurcan Yazğılı'" },
  { run = "player 'Uğurcan Yazğılı'", note = "no talks on screen now: nothing said" },
]

[[test]]
task = "T98"
name = "a press conference talked to its end"
at = "press"
fresh = true
repeat = 3
steps = [
  { read = "inbox", path = "?NewsItemIsPriority=True.?NewsHasResponded=False.0.NewsTitleString", keep = "msg", live = true },
  { run = "reply {msg} 2" },
  { read = "talk", path = "Answers.#", not = "0", live = true },
  { until = "talk", path = "Answers.#", is = "0", seconds = 300, every = 2, doing = "talk 1", live = true },
]
