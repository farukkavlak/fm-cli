# A run of several changes that stops part way says what it did (printed words: checked by eye, TR and EN);
# here the state is checked: the first instruction stays set though the second is refused, and a run
# refused at its first step changes nothing.
[[test]]
task = "T153"
name = "a refused opposition change at its first step changes nothing"
at = "calm"
fresh = true
steps = [
  { read = "opposition", path = "0.Name", keep = "who" },
  { read = "opposition", path = "0.Pressing", keep = "was" },
  { run = "opposition {who} Nonsense=1 Pressing=Always", rc = "fail" },
  { read = "opposition", path = "0.Pressing", same_as = "was" },
]

[[test]]
task = "T153"
name = "a half-done opposition change keeps its first part"
repeat = 3
at = "calm"
fresh = true
steps = [
  { read = "opposition", path = "0.Name", keep = "who" },
  { read = "opposition", path = "0.Pressing", keep = "was" },
  { run = "opposition {who} Pressing=Always Nonsense=1", rc = "fail" },
  { read = "opposition", path = "0.Pressing", differs_from = "was" },
]
