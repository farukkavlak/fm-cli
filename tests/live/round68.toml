# T153: every tool marked read-only, called bare, changes nothing in the game.
# The list comes from the tools marked Read in cli/fm/Core/Mcp.Tools.cs (bare calls; those needing a name are left out).

[[test]]
task = "T153"
name = "read-only tools change nothing"
at = "calm"
steps = [
  { read = "status", path = "Date", keep = "day" },
  { read = "finances", path = "Balance", keep = "balance" },
  { read = "tactic", path = "Slots.#", keep = "slots" },
  { read = "tactic", path = "Slots.0.PlayerIndex", keep = "keeper" },
  { read = "squad", path = "#", keep = "squad" },
  { read = "inbox", path = "?Unread=True.#", keep = "unread" },
  { run = "status", rc = "any" },
  { run = "squad", rc = "any" },
  { run = "players", rc = "any" },
  { run = "table", rc = "any" },
  { run = "fixtures", rc = "any" },
  { run = "calendar", rc = "any" },
  { run = "report", rc = "any" },
  { run = "tactic", rc = "any" },
