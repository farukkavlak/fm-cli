# Round 25: the youth intake (T59). Candidates with their status by the game's data (on trial until signed); one
# offered a youth contract through the actions menu and the contract card. Run: tools/fm-round.py dry
# tests/live/round25.toml, then run.

[[test]]
task = "T59"
name = "intake: candidates on trial, one offered a youth contract, a wrong action refused"
at = "intake"
fresh = true
repeat = 3
steps = [
  { read = "youth candidates", path = "#", not = "0", live = true },
  { read = "youth candidates", path = "?Signed=True.#", is = "0", live = true, note = "all on trial on the day after the intake" },
  { read = "youth candidates", path = "0.Name", keep = "who", live = true },
  { run = "actions {who} zzq", rc = "fail" },
  { read = "contract {who}", path = "Terms.#", not = "0", live = true, note = "a candidate on trial: talks by the game's approach to sign" },
  { run = "contract --next" },
  { run = "contract --sign --yes" },
  { run = "contract", rc = "fail", note = "the talks closed; his answer comes by message" },
]
