# Round 49: contracts at the season's end, and a match day the game's queue holds.
# - a player's "deal about to expire" message: its contract extension option, read back by the player's contract (T61);
# - an eleven short of a player: `match --instant` lets the game's held queue go and names the problem (T138).
# The walk's stop at "contracts set to expire" (T139) is a `fm-round.py forward` run, tried by hand (EN + TR 3/3).
# Run: tools/fm-round.py dry tests/live/round49.toml, then run.

[[test]]
task = "T61"
name = "the contract extension option from the player's message, read back by his contract"
at = "caught-2032-06-24"
fresh = true
repeat = 3
steps = [
  { read = "inbox", path = "?UniqueId=1826702.0.NewsTitleString", keep = "msg", live = true, note = "Yunus' deal about to expire" },
  { read = "player 'Yunus Eker'", path = "Player.ContractEnds", keep = "end", is = "30/6/2032" },
  { run = "reply {msg} 9", rc = "fail", note = "negative: no such answer" },
  { read = "player 'Yunus Eker'", path = "Player.ContractEnds", same_as = "end" },
  { run = "reply {msg} 2", note = "Trigger Extension" },
  { read = "player 'Yunus Eker'", path = "Player.ContractEnds", differs_from = "end" },
]

[[test]]
task = "T138"
name = "an eleven short of a player: match --instant does not sit silent on the squad screen"
at = "kickoff"
fresh = true
repeat = 3
steps = [
  { run = "tactic player ST --clear", note = "ten outfield players" },
  { run = "match --instant", rc = "any", note = "the warning comes, the queue let go" },
  { read = "status", path = "State", not = "CanContinue", note = "the match is not played with ten" },
  { run = "tactic pick" },
  { run = "match --instant", note = "a full eleven: the match is played" },
  { read = "status", path = "State", not = "Tactics" },
]

[[test]]
task = "T140"
name = "contracts set to expire: a row's decision taken, read back by the row and by the contract"
at = "contracts-expire"
fresh = true
repeat = 3
steps = [
  { read = "contracts --expiring", path = "?Name=Muhammed Erkasap.0.Done", is = "False" },
  { read = "player 'Muhammed Erkasap'", path = "Player.ContractEnds", keep = "end" },
  { read = "player 'Ömürcan Acar'", path = "Player.ContractEnds", keep = "other" },
  { run = "contracts --expiring Erkasap 9", rc = "fail", note = "negative: no such choice" },
  { run = "contracts --expiring zzqx 2", rc = "fail", note = "negative: no such player in the table" },
  { read = "contracts --expiring", path = "?Name=Muhammed Erkasap.0.Done", is = "False" },
  { run = "contracts --expiring Erkasap 2", note = "Trigger Extension" },
  { read = "contracts --expiring", path = "?Name=Muhammed Erkasap.0.Done", is = "True" },
  { run = "contracts --expiring Erkasap 2", rc = "fail", note = "decided already" },
  { run = "next" },
  { read = "player 'Muhammed Erkasap'", path = "Player.ContractEnds", differs_from = "end" },
  { read = "player 'Ömürcan Acar'", path = "Player.ContractEnds", same_as = "other", note = "a row not decided keeps its contract" },
]

[[test]]
task = "T142"
name = "a clause the game will not take on a one-year deal is named by its record, not left unmarked"
at = "contracts-expire"
fresh = true
repeat = 3
steps = [
  { run = "contracts --expiring Eray 1", note = "renewal talks opened from the message" },
  { run = "contract --next" },
  { run = "contract --term 'Contract Length=2 years'", run_tr = "contract --term 'Sözleşme Süresi=2 yıl'" },
  { read = "contract", path = "Facts.NotTaken", absent = true, live = true, note = "negative: two years, every clause taken" },
  { run = "contract --term 'Contract Length=1 year'", run_tr = "contract --term 'Sözleşme Süresi=1 yıl'" },
  { read = "contract", path = "Facts.NotTaken", present = true, live = true, note = "the promotion wage rise is not taken on one year" },
  { run = "contract --sign --yes", rc = "fail", note = "nothing goes to the agent, and it says why" },
]
