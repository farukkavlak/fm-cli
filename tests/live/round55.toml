# Round 55 (night): T25 again without playing the match out (round 54: the card applied 3/3 in EN, but one try then
# waited at an injury the game would not play on from without a substitute, which a list cannot pick).
# The card is applied, read back, a wrong number refused, and the match left where it is (`stop`).
# "No match" is left out: before kick-off `dugout apply` answers the staff's pre-match advice in this scenario.
# Run: tools/fm-round.py dry tests/live/round55.toml, then run.

[[test]]
task = "T25"
name = "slow speed: a dugout card applied puts a tweak on; a wrong number refused"
at = "kickoff"
fresh = true
repeat = 3
tries = 5
steps = [
  { run = "settings 'highlight speed' 1x" },
  { run = "settings 'speed between highlights' 4x" },
  { start = "match --play --no-talk" },
  { until = "tweak", path = "#", not = "0", seconds = 600, every = 10, live = true, again = "dugout apply", note = "kicked off; asked slowly (T92)" },
  { read = "tweak", path = "?WillBeOn=True.#", keep = "before", live = true },
  { until = "dugout apply", path = "TweaksOn.#", not = "0", seconds = 3600, every = 10, live = true, again = "status", moment = true, note = "an injury stop ends the try without the moment" },
  { read = "tweak", path = "?WillBeOn=True.#", differs_from = "before", live = true },
  { run = "dugout 99 apply", rc = "fail", note = "not a card" },
  { stop = true },
]
